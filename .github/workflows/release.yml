# Builds Garamut Music on Windows and publishes it.
#
#   push to main          -> auto-tag (vX.Y.Z-build.N), Nuitka build + installer, then a PUBLISHED
#                            GitHub Release marked "Latest" with the installer, its .sha256 and notes
#   tag v* (manual)       -> same pipeline, using the tag you pushed (must match version_info.txt)
#   Run workflow (manual) -> build only (Nuitka or PyInstaller); installer kept as an artifact,
#                            no tag and no release
#
# X.Y.Z comes from version_info.txt; N is the workflow run number, so every commit gets a unique
# tag. Bump version_info.txt (and add its "# Garamut Music X.Y.Z" section to RELEASE_NOTES.md)
# when you want a new version number. Commits whose message contains [skip ci] are not built.

name: Build

on:
  push:
    branches: [main]      # every commit to main is tagged, built and released
    tags: ["v*"]          # optional: manually pushed version tags
  workflow_dispatch:      # manual build-only runs from the Actions tab
    inputs:
      builder:
        description: Builder
        type: choice
        options: [pyinstaller, nuitka]
        default: nuitka

permissions:
  contents: read

# One build at a time per ref; newer commits queue instead of cancelling a running release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check sources
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile every Python file
        run: python -m compileall -q main.py app tools

      - name: Compute version and release tag
        id: meta
        run: |
          version="$(python tools/app_version.py)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, release tag $tag"

      - name: Release tag matches version_info.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${{ steps.meta.outputs.version }}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error file=version_info.txt::Tag $GITHUB_REF_NAME doesn't match version_info.txt ($version). Fix the version, commit, and move the tag."
            exit 1
          fi
          echo "Version $version matches the tag."

      - name: Release notes exist for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" > /dev/null

  build:
    name: Build (${{ (github.event_name != 'workflow_dispatch' || inputs.builder == 'nuitka') && 'Nuitka' || 'PyInstaller' }})
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILDER: ${{ (github.event_name != 'workflow_dispatch' || inputs.builder == 'nuitka') && 'nuitka' || 'pyinstaller' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # get_libmpv.py: avoids GitHub API rate limits
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      # The build scripts reuse a working .venv; creating it here pins it to this Python.
      - name: Create the virtual environment
        shell: cmd
        run: python -m venv .venv

      - name: Cache the audio engine (libmpv)
        uses: actions/cache@v5
        with:
          path: lib/libmpv-2.dll
          key: libmpv-${{ hashFiles('tools/get_libmpv.py') }}

      - name: Cache Nuitka
        if: env.BUILDER == 'nuitka'
        uses: actions/cache@v5
        with:
          path: .nuitka-cache
          key: nuitka-${{ hashFiles('requirements.txt', 'main.py', 'app/**/*.py') }}
          restore-keys: nuitka-

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { "Inno Setup already installed"; exit 0 }
          choco install innosetup --no-progress -y

      # No signing.env exists here (it's git-ignored), so CI builds are unsigned.
      - name: Build with PyInstaller, then the installer
        if: env.BUILDER == 'pyinstaller'
        shell: cmd
        run: call build_installer.bat /nopause

      - name: Build with Nuitka, then the installer
        if: env.BUILDER == 'nuitka'
        shell: cmd
        run: call build_installer.bat /nuitka /nopause

      - name: Upload the installer
        uses: actions/upload-artifact@v7      # keep in step with download-artifact@v8 below
        with:
          name: installer
          path: |
            dist/*-Setup-*.exe
            dist/*-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [check, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write                      # creates the tag and the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8    # pairs with upload-artifact@v7 above
        with:
          name: installer
          path: dist

      - name: Release notes (checksum filled in)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Use the version's section of RELEASE_NOTES.md if it exists,
          # otherwise fall back to the commit message.
          if python3 tools/release_notes.py "$VERSION" --checksum dist/*.sha256 > release-notes.md 2>/dev/null; then
            echo "Using RELEASE_NOTES.md section for $VERSION"
          else
            {
              echo "Automated build of \`${GITHUB_SHA::7}\` from \`$GITHUB_REF_NAME\`."
              echo
              git log -1 --pretty=format:'%s%n%n%b'
              echo
              echo
              echo "SHA-256:"
              echo '```'
              cat dist/*.sha256
              echo '```'
            } > release-notes.md
          fi
          cat release-notes.md

      # Creates the tag at this commit if it doesn't exist, then publishes the release as Latest.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Garamut Music ${{ needs.check.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*-Setup-*.exe
            dist/*-Setup-*.exe.sha256
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true